name = "investment-funds"
main = "cloudflare/worker.js"
compatibility_date = "2026-11-22"
workers_dev = true

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[observability.traces]
enabled = true

[vars]
UNUM_MINIMUM_ZAR = "50000"
UNUM_ANNUAL_RATE_PERCENT = "18.4"
